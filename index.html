<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理素质测试 · 八道题测出你的心理素质</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 30px 16px;
    color: #333;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    color: #fff;
    padding: 28px 24px;
    text-align: center;
  }
  header h1 { font-size: 24px; margin-bottom: 8px; letter-spacing: 1px; }
  header p { font-size: 14px; opacity: .9; line-height: 1.6; }
  .body { padding: 24px; }
  .question {
    margin-bottom: 26px;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 18px;
    background: #fafbff;
  }
  .q-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
  .q-title .num {
    display: inline-block; width: 24px; height: 24px; line-height: 24px;
    text-align: center; background: #6a11cb; color: #fff; border-radius: 50%;
    font-size: 13px; margin-right: 8px; vertical-align: middle;
  }
  .options label {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 12px; margin-bottom: 8px;
    border: 1.5px solid #ddd; border-radius: 8px;
    cursor: pointer; font-size: 14px; transition: all .2s;
    background: #fff;
  }
  .options label:hover { border-color: #6a11cb; background: #f3efff; }
  .options input[type=radio] { accent-color: #6a11cb; }
  .options label.selected { border-color: #6a11cb; background: #f0eaff; font-weight: 500; }
  .btn {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    transition: opacity .2s; margin-top: 6px;
  }
  .btn:hover { opacity: .88; }
  .btn.reset {
    background: #aaa; margin-top: 10px;
  }
  .result {
    margin-top: 20px; padding: 20px; border-radius: 12px;
    background: #f0f7ff; border: 1px solid #cfe4ff; display: none;
  }
  .result h3 { font-size: 20px; margin-bottom: 8px; color: #2575fc; }
  .result .score { font-size: 15px; color: #555; margin-bottom: 10px; }
  .result .desc { font-size: 15px; line-height: 1.8; color: #333; }
  .notice { font-size: 12px; color: #999; text-align: center; margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>心理素质测试</h1>
    <p>八道题测出你的心理素质与应变能力<br>请根据真实感受作答，完成后自动评分</p>
  </header>

  <div class="body" id="quiz">
    <!-- 题目将由 JS 动态生成 -->
  </div>
</div>

<script>
// 题目数据（来源：八道题测试你的心理素质）
var QUESTIONS = [
  { q: "你骑车闯红灯，被警察叫住；后者知道你急着要赶路，却故意拖延时间，这时你",
    options: [
      { t: "急得满头大汗，不知怎么办才好", s: 0 },
      { t: "十分友好地、平静地向警察道歉", s: 5 },
      { t: "听之任之，不作任何解释", s: 2 }
    ]},
  { q: "在朋友的婚礼上，你未料到会被邀请发言，在毫无准备的情况下，你",
    options: [
      { t: "双手发抖，结结巴巴说不出话来", s: 0 },
      { t: "感到很荣幸，简短地讲几句", s: 5 },
      { t: "很平淡地谢绝了", s: 2 }
    ]},
  { q: "你在餐馆刚用过餐，服务员来结账，你忽然发现身上带的钱不够，此刻，你会",
    options: [
      { t: "感到很窘迫，脸发红", s: 0 },
      { t: "自嘲一下，马上对服务员实话实说", s: 5 },
      { t: "在身上东摸西摸，拖延时间", s: 2 }
    ]},
  { q: "假如你乘坐公共汽车时忘了买票，被人查到，你的反应是",
    options: [
      { t: "尴尬，出冷汗", s: 0 },
      { t: "冷静，不慌不忙，接受处理", s: 5 },
      { t: "强作微笑", s: 2 }
    ]},
  { q: "你独自一人被关在电梯内出不来，你会",
    options: [
      { t: "脸色发白，恐慌不安", s: 0 },
      { t: "想方设法自己出去", s: 5 },
      { t: "耐心地等待救援", s: 2 }
    ]},
  { q: "有人像老朋友似的向你打招呼，但你一点也记不起他(她)是谁，此时你",
    options: [
      { t: "装作没听见似的不答理", s: 0 },
      { t: "直率地承认自己记不起来了", s: 5 },
      { t: "朝他(她)瞪瞪眼，一言不发", s: 2 }
    ]},
  { q: "你从超市里走出来，忽然意识到你拿着忘记付款的商品，此时一个很像保安人员的人朝你走过来，你会怎么办",
    options: [
      { t: "心怦怦跳，惊慌不措", s: 0 },
      { t: "诚实、友好地主动向他解释", s: 5 },
      { t: "迅速回转身去补付款", s: 2 }
    ]},
  { q: "假设你从国外回来，行李中携带了超过规定的烟酒数量，海关官员要求你打开提箱检查，这时你会",
    options: [
      { t: "感到害怕，两手发抖", s: 0 },
      { t: "泰然自若，听凭检查", s: 5 },
      { t: "与海关官员争辩，拒绝检查", s: 2 }
    ]}
];

// 结论区间（来源：文件）
function getResult(score) {
  if (score >= 0 && score <= 24) {
    return { title: "心理承受力偏弱", score: "0–24 分",
      desc: "你承受压力的心理素质比较差，很容易失去心理平衡，变得窘促不安，甚至惊慌失措。" };
  } else if (score >= 25 && score <= 31) {
    return { title: "心理素质较强", score: "25–31 分",
      desc: "你的心理素质比较强，性情还算比较稳定，遇事一般不会十分惊慌，但有时往往采取消极应付的态度。" };
  } else {
    return { title: "心理素质优秀", score: "32–40 分",
      desc: "你的心理素质很好，几乎没有令你感到尴尬的事，尽管偶尔会失去控制，但总体来说，你的应变能力很强，是一个能经常保持镇静、从容不迫的人。" };
  }
}

// 渲染题目
var quiz = document.getElementById("quiz");
var html = "";
QUESTIONS.forEach(function(item, i) {
  html += '<div class="question" data-q="' + i + '">';
  html += '<div class="q-title"><span class="num">' + (i + 1) + '</span>' + item.q + '</div>';
  html += '<div class="options">';
  item.options.forEach(function(op, j) {
    html += '<label data-val="' + op.s + '">';
    html += '<input type="radio" name="q' + i + '" value="' + op.s + '"> ' + op.t;
    html += '</label>';
  });
  html += '</div></div>';
});
html += '<button class="btn" id="submitBtn">提交测试，查看结果</button>';
html += '<button class="btn reset" id="resetBtn" style="display:none">重新测试</button>';
html += '<div class="result" id="result"></div>';
html += '<div class="notice">本测试结果仅供参考，不构成专业心理诊断</div>';
quiz.innerHTML = html;

// 选项选中高亮
quiz.addEventListener("change", function(e) {
  if (e.target.type === "radio") {
    var labels = e.target.closest(".options").querySelectorAll("label");
    labels.forEach(function(l) { l.classList.remove("selected"); });
    e.target.closest("label").classList.add("selected");
  }
});

// 提交
document.getElementById("submitBtn").addEventListener("click", function() {
  var total = 0, answered = 0;
  for (var i = 0; i < QUESTIONS.length; i++) {
    var checked = document.querySelector('input[name="q' + i + '"]:checked');
    if (checked) { total += parseInt(checked.value, 10); answered++; }
  }
  if (answered < QUESTIONS.length) {
    alert("请完成全部 " + QUESTIONS.length + " 道题目后再提交。");
    return;
  }
  var r = getResult(total);
  var box = document.getElementById("result");
  box.style.display = "block";
  box.innerHTML = "<h3>" + r.title + "</h3>" +
    "<div class='score'>你的得分：" + total + " 分（" + r.score + "）</div>" +
    "<div class='desc'>" + r.desc + "</div>";
  document.getElementById("submitBtn").style.display = "none";
  document.getElementById("resetBtn").style.display = "block";
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
});

// 重测
document.getElementById("resetBtn").addEventListener("click", function() {
  quiz.querySelectorAll('input[type=radio]').forEach(function(r) { r.checked = false; });
  quiz.querySelectorAll(".options label").forEach(function(l) { l.classList.remove("selected"); });
  document.getElementById("result").style.display = "none";
  document.getElementById("submitBtn").style.display = "block";
  document.getElementById("resetBtn").style.display = "none";
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>

</body>
</html>
